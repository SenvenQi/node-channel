name: Publish

# Publishes @sevenqi/nodechannel to npm when a version tag is pushed.
#
# Usage:
#   1. Bump "version" in package.json (e.g. 1.2.0) and commit.
#   2. Tag the commit and push the tag:
#        git tag v1.2.0
#        git push origin v1.2.0
#   The tag version must match package.json, or the job fails fast.
#
# Requires an npm automation token stored as the NPM_TOKEN repository secret
# (Settings -> Secrets and variables -> Actions).
on:
  push:
    tags:
      - "v*"
  # Allow publishing the current package.json version manually from the
  # Actions tab without pushing a tag.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing $PKG_VERSION"

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Build (type-check + emit)
        run: yarn build

      - name: Test
        run: yarn test

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
